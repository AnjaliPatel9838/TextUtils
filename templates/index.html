      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

      <form class="d-flex" role="search">

<!--  #Alert-->

  <div class="alert alert-warning alert-dismissible fade show" role="alert">
  <strong>Welcome To TextUtils!</strong> You can do anything  with your texr here !.
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

  <div class="container">

<!--      #TextArea-->

<form action='/analyze' method='post'>{% csrf_token %}
<!--  use of csrf token :: use when use post method-->
<div class="mb-3">
  <label for="exampleFormControlTextarea1" class="form-label">Enter Your text To see the Magic</label>
  <textarea class="form-control" name='text' id="exampleFormControlTextarea1" rows="7"></textarea>
</div>


<!--      #Checkbox Section-->

<!--      #Punc Checkbox-->
      <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="removepunc" role="switch" id="switchCheckDefault1" >
  <label class="form-check-label" for="switchCheckDefault">Remove Punctuation</label>
</div>
<!--      #Caps Checkbox-->
  <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="fullcaps" role="switch" id="switchCheckDefault2">
  <label class="form-check-label" for="switchCheckDefault">Capital letter</label>
</div>
<!--      #Newline Check-->
  <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="newlineremover" role="switch" id="switchCheckDefault3">
  <label class="form-check-label" for="switchCheckDefault">Remove new line</label>
</div>
<!--      ExtraSpace Checkbox-->
      <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="extraspaceremever" role="switch" id="switchCheckDefault4">
  <label class="form-check-label" for="switchCheckDefault">Remove Extra space</label>
</div>
<!--      #char Cout Checkbox-->
      <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" name="charcouter" role="switch" id="switchCheckDefault5">
  <label class="form-check-label" for="switchCheckDefault">Count Char</label>
</div>
<!--      #button-->
      <button type="submit" class="btn btn-dark">Analyze Text</button>
</form>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

  </body>
</html>
